name: Check volunteer slots

on:
  # GitHub's native "schedule" trigger is unreliable (can drift by hours,
  # sometimes skips windows entirely). Instead, an external service
  # (cron-job.org) pings this via the GitHub API to fire workflow_dispatch
  # on an actual reliable hourly schedule.
  workflow_dispatch:
    inputs:
      force_summary:
        description: "Force the full summary notification (for manual testing)"
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

jobs:
  check-slots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run slot checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_SUMMARY: ${{ github.event.inputs.force_summary }}
        run: python check_slots.py

      - name: Publish dashboard data
        run: |
          mkdir -p docs
          cp state.json docs/state.json

      - name: Commit updated state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json docs/state.json
          git diff --quiet --cached || git commit -m "Update slot state"
          git push
