name: Check volunteer slots

on:
  schedule:
    # Runs every hour, on the hour, in UTC. The script itself decides
    # whether to send the full summary (once/day) or stay silent unless
    # something changed - see SUMMARY_HOUR_UTC in check_slots.py.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # manual "Run workflow" trigger always sends the summary, for testing

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

jobs:
  check-slots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run slot checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python check_slots.py

      - name: Commit updated state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update slot state"
          git push
