name: Check volunteer slots

on:
  schedule:
    # NOTE: GitHub Actions cron is in UTC and does NOT auto-adjust for
    # daylight saving time. These times are set for EDT (UTC-4), i.e.
    # summer time in NYC:
    #   15:00 UTC = 11:00 AM EDT
    #   00:00 UTC = 8:00 PM EDT (same calendar day in ET)
    # When NYC switches to EST (UTC-5) in November, these will run
    # 1 hour later than intended (e.g. 11am becomes 12pm) unless you
    # update the cron lines below to 16:00 and 01:00.
    - cron: "0 15 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger for testing

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

jobs:
  check-slots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run slot checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_slots.py

      - name: Commit updated state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update slot state"
          git push
